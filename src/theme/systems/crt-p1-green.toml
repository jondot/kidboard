# crt · P1 green — the phosphor Logo was actually taught on.
#
# P1 is the willemite green of a lab scope and of every terminal in a school
# computer room. Long persistence: a moved turtle left a trail that faded
# rather than vanished, which is why the field in this system keeps what was
# drawn on it.
